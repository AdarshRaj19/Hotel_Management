<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reservations - HotelEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-briefcase-fill text-warning"></i> My Reservations</h2>
                <p class="text-muted mb-0">Track upcoming stays, vouchers, and reservation history</p>
            </div>
            <a th:href="@{/rooms}" class="btn btn-warning fw-semibold"><i class="bi bi-plus-circle"></i> New Booking</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Booking #</th>
                                <th>Room Details</th>
                                <th>Check-in</th>
                                <th>Check-out</th>
                                <th>Guests</th>
                                <th>Tariff</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(bookings)}">
                                <td colspan="8" class="text-center py-5 text-muted">
                                    <i class="bi bi-calendar2-x display-4 d-block mb-3"></i>
                                    <h5>No bookings found</h5>
                                    <p class="small text-muted">You haven't reserved any rooms yet.</p>
                                    <a th:href="@{/rooms}" class="btn btn-primary btn-sm">Find Rooms</a>
                                </td>
                            </tr>
                            <tr th:each="b : ${bookings}">
                                <td class="fw-bold" th:text="'#' + ${b.id}">#1</td>
                                <td>
                                    <strong th:text="'Room ' + ${b.room.roomNumber}">Room 101</strong>
                                    <small class="text-muted d-block" th:text="${b.room.roomType.name}">Deluxe</small>
                                </td>
                                <td th:text="${b.checkInDate}">2026-11-10</td>
                                <td th:text="${b.checkOutDate}">2026-11-12</td>
                                <td><i class="bi bi-people-fill text-muted"></i> <span th:text="${b.numberOfGuests}">2</span></td>
                                <td class="fw-bold">&#8377;<span th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 2, 'POINT')}">5,000</span></td>
                                <td>
                                    <span th:class="'badge ' + (${b.bookingStatus.name() == 'CONFIRMED'} ? 'bg-success' : (${b.bookingStatus.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-primary'))"
                                          th:text="${b.bookingStatus}">CONFIRMED</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{'/booking/' + ${b.id}}" class="btn btn-outline-primary btn-sm me-1">
                                        <i class="bi bi-ticket-perforated"></i> Voucher
                                    </a>
                                    <form th:if="${b.bookingStatus.name() == 'CONFIRMED'}"
                                          th:action="@{'/booking/' + ${b.id} + '/cancel'}" method="post" class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to cancel booking #' + [[${b.id}]] + '?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            Cancel
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
