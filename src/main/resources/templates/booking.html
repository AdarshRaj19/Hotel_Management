<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Reservation - HotelEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 flex-grow-1">
        <a th:href="@{/rooms}" class="btn btn-outline-secondary btn-sm mb-4"><i class="bi bi-arrow-left"></i> Back to Rooms</a>

        <div class="row g-4 justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white p-4">
                        <h4 class="fw-bold mb-1 text-warning"><i class="bi bi-calendar2-check-fill"></i> Complete Your Room Reservation</h4>
                        <p class="text-white-50 small mb-0">Select your dates and confirm your stay with immediate confirmation</p>
                    </div>
                    <div class="card-body p-4">

                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/booking/create}" th:object="${bookingRequest}" method="post">
                            
                            <!-- Selected Room Info -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Select Room</label>
                                <select th:field="*{roomId}" class="form-select" id="roomSelect" required>
                                    <option th:each="r : ${rooms}"
                                            th:value="${r.id}"
                                            th:data-price="${r.pricePerNight}"
                                            th:data-capacity="${r.capacity}"
                                            th:text="'Room #' + ${r.roomNumber} + ' - ' + ${r.roomType.name} + ' (&#8377;' + ${r.pricePerNight} + ' / night - Max ' + ${r.capacity} + ' guests)'"
                                            th:selected="${selectedRoom != null and selectedRoom.id == r.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold"><i class="bi bi-calendar-event text-primary"></i> Check-in Date</label>
                                    <input type="date" th:field="*{checkInDate}" id="checkInDate" class="form-control" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('checkInDate')}" th:errors="*{checkInDate}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold"><i class="bi bi-calendar-event-fill text-primary"></i> Check-out Date</label>
                                    <input type="date" th:field="*{checkOutDate}" id="checkOutDate" class="form-control" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('checkOutDate')}" th:errors="*{checkOutDate}"></div>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold"><i class="bi bi-people text-primary"></i> Number of Guests</label>
                                    <input type="number" th:field="*{numberOfGuests}" min="1" max="10" value="1" class="form-control" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('numberOfGuests')}" th:errors="*{numberOfGuests}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold"><i class="bi bi-chat-left-dots text-primary"></i> Special Requests (Optional)</label>
                                    <input type="text" th:field="*{specialRequests}" placeholder="e.g. Quiet room, late check-in" class="form-control">
                                </div>
                            </div>

                            <!-- Live Tariff Estimation Box -->
                            <div class="card bg-light border-0 p-3 mb-4 rounded-3">
                                <h6 class="fw-bold mb-2">Estimated Tariff Breakdown</h6>
                                <div class="d-flex justify-content-between small text-muted mb-1">
                                    <span>Rate per Night:</span>
                                    <span id="rateLabel">&#8377;0.00</span>
                                </div>
                                <div class="d-flex justify-content-between small text-muted mb-1">
                                    <span>Duration:</span>
                                    <span id="nightsLabel">0 nights</span>
                                </div>
                                <hr class="my-2">
                                <div class="d-flex justify-content-between fw-bold fs-5 text-dark">
                                    <span>Total Payable:</span>
                                    <span class="text-success" id="totalLabel">&#8377;0.00</span>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-warning btn-lg fw-bold py-3">
                                    <i class="bi bi-check2-circle"></i> Confirm & Book Reservation
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateTariff() {
            const roomSelect = document.getElementById('roomSelect');
            const checkIn = document.getElementById('checkInDate').value;
            const checkOut = document.getElementById('checkOutDate').value;
            const selectedOption = roomSelect.options[roomSelect.selectedIndex];
            const price = selectedOption ? parseFloat(selectedOption.getAttribute('data-price')) : 0;

            document.getElementById('rateLabel').innerText = '₹' + price.toLocaleString('en-IN');

            if (checkIn && checkOut) {
                const d1 = new Date(checkIn);
                const d2 = new Date(checkOut);
                const diffTime = d2 - d1;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays > 0) {
                    document.getElementById('nightsLabel').innerText = diffDays + ' night' + (diffDays > 1 ? 's' : '');
                    const total = diffDays * price;
                    document.getElementById('totalLabel').innerText = '₹' + total.toLocaleString('en-IN');
                    return;
                }
            }
            document.getElementById('nightsLabel').innerText = '0 nights';
            document.getElementById('totalLabel').innerText = '₹0.00';
        }

        document.getElementById('roomSelect').addEventListener('change', updateTariff);
        document.getElementById('checkInDate').addEventListener('change', updateTariff);
        document.getElementById('checkOutDate').addEventListener('change', updateTariff);
        window.addEventListener('DOMContentLoaded', updateTariff);
    </script>
</body>
</html>
