<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms - Admin - HotelEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-door-open-fill text-warning"></i> Room Inventory Management</h2>
                <p class="text-muted mb-0">Add, edit, delete, and inspect hotel rooms</p>
            </div>
            <button class="btn btn-warning fw-semibold" data-bs-toggle="modal" data-bs-target="#addRoomModal">
                <i class="bi bi-plus-circle"></i> Add New Room
            </button>
        </div>

        <!-- Alert notifications -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Rooms Table Card -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Room #</th>
                                <th>Room Type</th>
                                <th>Tariff / Night</th>
                                <th>Capacity</th>
                                <th>Status</th>
                                <th>Description</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="room : ${rooms}">
                                <td class="fw-bold" th:text="${room.roomNumber}">101</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${room.roomType.name}">Deluxe</span>
                                </td>
                                <td>&#8377;<span th:text="${#numbers.formatDecimal(room.pricePerNight, 0, 'COMMA', 2, 'POINT')}">2,500</span></td>
                                <td><i class="bi bi-people-fill text-muted"></i> <span th:text="${room.capacity}">2</span></td>
                                <td>
                                    <span th:class="'badge ' + (${room.status.name() == 'AVAILABLE'} ? 'bg-success' : (${room.status.name() == 'OCCUPIED'} ? 'bg-danger' : 'bg-warning text-dark'))"
                                          th:text="${room.status}">AVAILABLE</span>
                                </td>
                                <td class="text-muted small" style="max-width: 250px;" th:text="${room.description}">Comfortable room</td>
                                <td class="text-end">
                                    <button class="btn btn-outline-primary btn-sm me-1"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#editRoomModal-' + ${room.id}">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <form th:action="@{'/admin/rooms/delete/' + ${room.id}}" method="post" class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to delete room #' + [[${room.roomNumber}]] + '?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>

                                <!-- Edit Modal for this room -->
                                <div class="modal fade" th:id="'editRoomModal-' + ${room.id}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <form th:action="@{'/admin/rooms/edit/' + ${room.id}}" method="post">
                                                <div class="modal-header">
                                                    <h5 class="modal-title fw-bold">Edit Room #<span th:text="${room.roomNumber}"></span></h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <div class="mb-3">
                                                        <label class="form-label">Room Number</label>
                                                        <input type="text" name="roomNumber" th:value="${room.roomNumber}" class="form-control" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Room Type</label>
                                                        <select name="roomTypeId" class="form-select" required>
                                                            <option th:each="type : ${roomTypes}"
                                                                    th:value="${type.id}"
                                                                    th:text="${type.name}"
                                                                    th:selected="${type.id == room.roomType.id}">
                                                            </option>
                                                        </select>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Price per Night (&#8377;)</label>
                                                        <input type="number" step="0.01" name="pricePerNight" th:value="${room.pricePerNight}" class="form-control" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Capacity (Guests)</label>
                                                        <input type="number" name="capacity" min="1" max="10" th:value="${room.capacity}" class="form-control" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Status</label>
                                                        <select name="status" class="form-select" required>
                                                            <option th:each="st : ${statuses}"
                                                                    th:value="${st}"
                                                                    th:text="${st}"
                                                                    th:selected="${st == room.status}">
                                                            </option>
                                                        </select>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Description</label>
                                                        <textarea name="description" rows="3" class="form-control" th:text="${room.description}"></textarea>
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                                    <button type="submit" class="btn btn-primary">Save Changes</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Room Modal -->
    <div class="modal fade" id="addRoomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/rooms/add}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Add New Hotel Room</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Room Number</label>
                            <input type="text" name="roomNumber" placeholder="e.g. 501" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Room Type</label>
                            <select name="roomTypeId" class="form-select" required>
                                <option value="">Select Room Type</option>
                                <option th:each="type : ${roomTypes}"
                                        th:value="${type.id}"
                                        th:text="${type.name} + ' (Default: &#8377;' + ${type.defaultPrice} + ')'">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price per Night (&#8377;)</label>
                            <input type="number" step="0.01" name="pricePerNight" placeholder="e.g. 3000" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Capacity (Guests)</label>
                            <input type="number" name="capacity" min="1" max="10" value="2" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Initial Status</label>
                            <select name="status" class="form-select" required>
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" rows="3" placeholder="Room details and view information..." class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-warning fw-semibold">Add Room</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
