<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Hotel Bookings - HotelEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-calendar2-range text-warning"></i> Reservation Management</h2>
                <p class="text-muted mb-0">Inspect, monitor, and override bookings across all guests</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Admin Dashboard</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Filter Bar -->
        <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
            <form th:action="@{/admin/bookings}" method="get" class="row g-2 align-items-center">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="search" th:value="${search}" placeholder="Search by booking #, guest name, or room number..." class="form-control">
                    </div>
                </div>
                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="st : ${statuses}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${selectedStatus != null and selectedStatus == st}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel"></i> Filter</button>
                    <a th:href="@{/admin/bookings}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></a>
                </div>
            </form>
        </div>

        <!-- Bookings Master Table -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Guest</th>
                                <th>Room</th>
                                <th>Dates</th>
                                <th>Guests</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(bookings)}">
                                <td colspan="8" class="text-center py-5 text-muted">No reservations found.</td>
                            </tr>
                            <tr th:each="b : ${bookings}">
                                <td class="fw-bold" th:text="'#' + ${b.id}">#1</td>
                                <td>
                                    <strong th:text="${b.user.fullName}">Guest Name</strong>
                                    <small class="text-muted d-block" th:text="${b.user.email}">email</small>
                                </td>
                                <td>
                                    <strong th:text="'Room ' + ${b.room.roomNumber}">Room 101</strong>
                                    <small class="text-muted d-block" th:text="${b.room.roomType.name}">Deluxe</small>
                                </td>
                                <td>
                                    <span th:text="${b.checkInDate}">2026-11-05</span> to <span th:text="${b.checkOutDate}">2026-11-08</span>
                                </td>
                                <td><i class="bi bi-people-fill text-muted"></i> <span th:text="${b.numberOfGuests}">2</span></td>
                                <td class="fw-bold">&#8377;<span th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 2, 'POINT')}">5,000</span></td>
                                <td>
                                    <span th:class="'badge ' + (${b.bookingStatus.name() == 'CONFIRMED'} ? 'bg-primary' : (${b.bookingStatus.name() == 'CHECKED_IN'} ? 'bg-warning text-dark' : (${b.bookingStatus.name() == 'CHECKED_OUT'} ? 'bg-success' : 'bg-danger')))"
                                          th:text="${b.bookingStatus}">CONFIRMED</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{'/booking/' + ${b.id}}" class="btn btn-outline-info btn-sm me-1">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                    <form th:if="${b.bookingStatus.name() != 'CANCELLED' and b.bookingStatus.name() != 'CHECKED_OUT'}"
                                          th:action="@{'/admin/bookings/' + ${b.id} + '/cancel'}" method="post" class="d-inline"
                                          onsubmit="return confirm('Administrator override: Are you sure you want to cancel booking #' + [[${b.id}]] + '?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            Cancel
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
