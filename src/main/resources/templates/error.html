<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - HotelEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-auto py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="col-md-7 col-lg-6 text-center">
            <div class="card border-0 shadow-lg rounded-4 p-5 bg-white">
                <div class="display-1 text-warning mb-3">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h2 class="fw-bold mb-2">Oops! Something went wrong</h2>
                <div class="badge bg-secondary-subtle text-secondary fs-6 mb-3">
                    Status: <span th:text="${status != null ? status : 500}">500</span> - <span th:text="${error != null ? error : 'Internal Server Error'}">Error</span>
                </div>
                <p class="lead text-muted mb-4" th:text="${message != null ? message : 'The requested resource could not be found or an unexpected error occurred.'}">
                    Error details
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-warning px-4 fw-semibold"><i class="bi bi-house"></i> Return Home</a>
                    <a th:href="@{/rooms}" class="btn btn-outline-dark px-4"><i class="bi bi-search"></i> Browse Rooms</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
